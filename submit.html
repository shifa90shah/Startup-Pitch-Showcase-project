<main class="submit-page">

    <section class="submit-header">
        <h1>Submit Your Startup Pitch</h1>
        <p>
            Share your startup idea and connect with potential investors.
        </p>
    </section>

    <section class="pitch-form-container">

        <form id="pitchForm">

            <div class="form-group">
                <label for="startupName">Startup Name</label>
                <input
                    type="text"
                    id="startupName"
                    placeholder="Enter startup name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="founderName">Founder Name</label>
                <input
                    type="text"
                    id="founderName"
                    placeholder="Enter founder name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="category">Startup Category</label>

                <select id="category" required>
                    <option value="">Select category</option>
                    <option value="Technology">Technology</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Finance">Finance</option>
                    <option value="Education">Education</option>
                    <option value="Transportation">Transportation</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Startup Description</label>

                <textarea
                    id="description"
                    rows="6"
                    placeholder="Describe your startup idea..."
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="funding">Funding Target ($)</label>

                <input
                    type="number"
                    id="funding"
                    placeholder="e.g. 250000"
                    required
                >
            </div>

            <div class="form-group">
                <label for="videoUrl">Pitch Video URL</label>

                <input
                    type="url"
                    id="videoUrl"
                    placeholder="https://youtube.com/..."
                >
            </div>

            <div class="form-group">
                <label for="pitchDeck">Pitch Deck (PDF)</label>

                <input
                    type="file"
                    id="pitchDeck"
                    accept=".pdf"
                >
            </div>

            <button type="submit" class="submit-btn">
                Submit Pitch
            </button>

        </form>

        <div id="formMessage"></div>

    </section>

</main>
